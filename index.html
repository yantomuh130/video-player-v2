<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#111111">
<title>Video Player</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 15px;
  background: #111;
  color: #fff;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 850px;
  margin: auto;
}

h2 {
  text-align: center;
  color: #ff4fa3;
  margin-bottom: 20px;
}

video {
  display: block;
  width: 100%;
  background: #000;
  border-radius: 10px;
}

.buttons {
  display: flex;
  gap: 12px;
  margin-top: 15px;
}

button {
  flex: 1;
  padding: 14px 10px;
  border: none;
  border-radius: 8px;
  background: #ff4fa3;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #e52d83;
}

.info {
  text-align: center;
  color: #aaa;
  font-size: 13px;
  margin-top: 18px;
}

.status {
  text-align: center;
  color: #ffb4d5;
  font-size: 14px;
  margin-top: 12px;
}

@media (max-width: 480px) {
  body {
    padding: 10px;
  }

  .buttons {
    gap: 8px;
  }

  button {
    font-size: 14px;
    padding: 13px 5px;
  }
}
</style>
</head>

<body>

<div class="container">

<h2>VIDEO PLAYER</h2>

<video
  id="player"
  controls
  playsinline
  preload="metadata">
  Browser tidak mendukung video.
</video>

<div class="buttons">
  <button id="uploadBtn">Upload</button>
  <button id="moreBtn">Cek Lainnya</button>
</div>

<div id="status" class="status">
Memuat video...
</div>

<p class="info">Selamat menonton</p>

</div>

<script>
"use strict";

// ==================================
// KONFIGURASI ADSTERRA
// ==================================

const ADSTERRA_URL =
"https://auctionr.org/4/082c0172cd3ad57615967c63448360ec";

// ==================================
// ELEMENT
// ==================================

const player = document.getElementById("player");
const uploadBtn = document.getElementById("uploadBtn");
const moreBtn = document.getElementById("moreBtn");
const statusBox = document.getElementById("status");

// ==================================
// TOMBOL IKLAN
// Tidak ada redirect otomatis
// ==================================

function openAdsterra() {
  window.open(
    ADSTERRA_URL,
    "_blank",
    "noopener,noreferrer"
  );
}

uploadBtn.addEventListener("click", openAdsterra);
moreBtn.addEventListener("click", openAdsterra);

// ==================================
// MENDAPATKAN ID VIDEO
// Mendukung #/video-id dan /video-id
// ==================================

function getVideoId() {
  const params = new URLSearchParams(location.search);

  if (params.get("v")) {
    return decodeURIComponent(params.get("v"));
  }

  const hash = location.hash
    .replace(/^#\/?/, "")
    .trim();

  if (hash) {
    return decodeURIComponent(hash);
  }

  const parts = location.pathname
    .split("/")
    .filter(Boolean);

  const lastPart = parts[parts.length - 1];

  if (
    lastPart &&
    lastPart.toLowerCase() !== "index.html"
  ) {
    return decodeURIComponent(lastPart);
  }

  return "";
}

// ==================================
// PENYIMPANAN POSISI VIDEO
// ==================================

let currentVideoId = "";
let lastSavedTime = 0;

function storageKey() {
  return "video_position_" + currentVideoId;
}

function savePosition() {
  if (!currentVideoId || !Number.isFinite(player.currentTime)) {
    return;
  }

  try {
    sessionStorage.setItem(
      storageKey(),
      String(player.currentTime)
    );
  } catch (error) {
    console.warn("Gagal menyimpan posisi video:", error);
  }
}

player.addEventListener("timeupdate", () => {
  if (player.currentTime - lastSavedTime >= 2) {
    savePosition();
    lastSavedTime = player.currentTime;
  }
});

player.addEventListener("pause", savePosition);
player.addEventListener("seeking", savePosition);

window.addEventListener("pagehide", savePosition);

// ==================================
// MEMULIHKAN POSISI VIDEO
// ==================================

player.addEventListener("loadedmetadata", () => {
  try {
    const savedTime = Number(
      sessionStorage.getItem(storageKey())
    );

    if (
      Number.isFinite(savedTime) &&
      savedTime > 0 &&
      savedTime < player.duration
    ) {
      player.currentTime = savedTime;
    }

    statusBox.textContent = "Video siap diputar";
  } catch (error) {
    statusBox.textContent = "Video siap diputar";
  }
});

// ==================================
// MEMUAT VIDEOS.JSON
// ==================================

async function loadVideo() {
  currentVideoId = getVideoId();

  if (!currentVideoId) {
    statusBox.textContent =
      "ID video tidak ditemukan.";
    return;
  }

  try {
    const response = await fetch(
      "/videos.json",
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("videos.json tidak ditemukan");
    }

    const data = await response.json();

    if (!Array.isArray(data.videos)) {
      throw new Error("Format videos.json tidak valid");
    }

    const selected = data.videos.find(
      item => item.id === currentVideoId
    );

    if (!selected || !selected.cdn) {
      statusBox.textContent =
        "Video tidak ditemukan.";
      return;
    }

    player.src = selected.cdn;
    player.load();

    statusBox.textContent =
      "Memuat video...";

  } catch (error) {
    console.error(error);

    statusBox.textContent =
      "Gagal memuat video. Periksa videos.json.";
  }
}

// ==================================
// ERROR VIDEO
// ==================================

player.addEventListener("error", () => {
  statusBox.textContent =
    "Video gagal diputar. Periksa URL CDN.";
});

// ==================================
// JALANKAN PLAYER
// ==================================

loadVideo();

</script>

</body>
</html>
