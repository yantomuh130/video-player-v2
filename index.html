<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>accimg - Video Player</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #fff;
  color: #111;
  font-family: Arial, sans-serif;
}

header {
  height: 110px;
  padding: 15px 5%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #eee;
}

.logo {
  font-size: 42px;
  font-weight: 400;
  letter-spacing: -2px;
}

.ad-button {
  background: #20202e;
  color: white;
  border: 0;
  border-radius: 50px;
  padding: 17px 48px;
  font-size: 22px;
  text-decoration: none;
  display: inline-block;
}

.player-container {
  width: 100%;
  display: flex;
  justify-content: center;
  padding: 0 12px;
  margin-top: 0;
}

video {
  width: 100%;
  max-width: 425px;
  aspect-ratio: 9 / 16;
  object-fit: contain;
  background: #000;
  display: block;
}

.collection {
  text-align: center;
  margin: 55px 0 35px;
}

.collection a {
  color: #6385b5;
  text-decoration: none;
  font-size: 30px;
  font-weight: 300;
}

.message {
  text-align: center;
  padding: 25px;
  color: #777;
  font-size: 15px;
}

@media (max-width: 600px) {
  header {
    height: 110px;
    padding: 12px 5%;
  }

  .logo {
    font-size: 38px;
  }

  .ad-button {
    padding: 15px 35px;
    font-size: 19px;
  }

  video {
    max-width: 425px;
  }

  .collection {
    margin-top: 55px;
  }

  .collection a {
    font-size: 27px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">accimg</div>

  <a class="ad-button ad-link"
     href="https://auctionr.org/4/082c0172cd3ad57615967c63448360ec"
     target="_blank"
     rel="noopener noreferrer">
    Upload
  </a>
</header>

<main>
  <div class="player-container">
    <video id="player" controls playsinline preload="metadata">
      Browser kamu tidak mendukung video.
    </video>
  </div>

  <div class="collection">
    <a class="ad-link"
       href="https://auctionr.org/4/082c0172cd3ad57615967c63448360ec"
       target="_blank"
       rel="noopener noreferrer">
      Cek koleksi lainnya
    </a>
  </div>

  <div class="message" id="message">
    Memuat video...
  </div>
</main>

<script>
(async function () {
  const player = document.getElementById("player");
  const message = document.getElementById("message");

  try {
    const response = await fetch("/videos.json", {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("videos.json tidak ditemukan");
    }

    const data = await response.json();
    const videos = data.videos || [];

    if (!videos.length) {
      throw new Error("Daftar video kosong");
    }

    const params = new URLSearchParams(location.search);
    let filename = params.get("f");

    if (!filename) {
      filename = decodeURIComponent(
        location.pathname.split("/").filter(Boolean).pop() || ""
      );
    }

    let selected = videos.find(item =>
      item.id === filename
    );

    // Jika tidak ada ID tertentu, pilih video secara acak.
    if (!selected) {
      selected = videos[
        Math.floor(Math.random() * videos.length)
      ];
    }

    if (!selected.cdn) {
      throw new Error("URL CDN video tidak tersedia");
    }

    player.src = selected.cdn;
    player.load();

    message.textContent = "";

    player.addEventListener("error", function () {
      message.textContent =
        "Video gagal dimuat. Silakan coba lagi.";
    });

  } catch (error) {
    console.error(error);
    message.textContent =
      "Gagal memuat video. Periksa videos.json.";
  }
})();
</script>

</body>
</html>
