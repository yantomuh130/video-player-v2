<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>acceimg - Video Player</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #fff;
    color: #111;
}
header {
    height: 64px;
    padding: 0 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #eee;
}
.logo {
    font-size: 24px;
    font-weight: 800;
}
.btn {
    background: #111;
    color: white;
    text-decoration: none;
    padding: 11px 19px;
    border-radius: 9px;
    font-size: 14px;
}
main {
    padding: 25px 12px;
    text-align: center;
}
video {
    display: block;
    width: 65%;
    max-width: 426px;
    height: auto;
    max-height: 75vh;
    margin: 0 auto;
    background: #000;
    object-fit: contain;
}
.collection {
    display: inline-block;
    margin-top: 20px;
    color: #1685e8;
    text-decoration: none;
    font-weight: 600;
}
</style>
</head>
<body>
<header>
    <div class="logo">acceimg</div>
    <a class="btn" href="https://auctionr.org/4/082c0172cd3ad57615967c63448360ec" target="_blank" rel="noopener">Upload</a>
</header>

<main>
    <video id="player" controls playsinline preload="metadata"></video>
    <div id="message"></div>
    <a class="collection" href="https://auctionr.org/4/082c0172cd3ad57615967c63448360ec" target="_blank" rel="noopener">Cek koleksi lainnya</a>
</main>

<script>
(async function () {
    const player = document.getElementById("player");
    const message = document.getElementById("message");

    // Ambil nama file langsung dari URL, contoh /8968ce9b.mp4
    const filename = decodeURIComponent(location.pathname.split("/").pop());

    if (!/^[a-zA-Z0-9_-]+\.mp4$/i.test(filename)) {
        message.textContent = "Link video tidak valid.";
        return;
    }

    try {
        const response = await fetch("/videos.json");
        if (!response.ok) throw new Error("Gagal membaca videos.json");

        const data = await response.json();
        const videos = Array.isArray(data) ? data : data.videos;

        if (!Array.isArray(videos)) throw new Error("Format videos.json tidak sesuai");

        const selected = videos.find(item =>
            item.id === filename ||
            item.id === "upload/?" + "f=" + filename ||
            item.id === "upload/" + filename
        );

        if (!selected || !selected.cdn) {
            message.textContent = "Video tidak ditemukan.";
            return;
        }

        player.src = selected.cdn;
        player.load();
    } catch (error) {
        message.textContent = "Video gagal dimuat. Silakan coba lagi.";
        console.error(error);
    }
})();
</script>
</body>
</html>
