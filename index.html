<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>acceimg - Video Player</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #fff;
    color: #111;
}

header {
    height: 64px;
    padding: 0 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #eee;
}

.logo {
    font-size: 24px;
    font-weight: 800;
}

.btn {
    background: #0088cc;
    color: white;
    text-decoration: none;
    padding: 11px 19px;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 600;
}

main {
    padding: 25px 12px;
    text-align: center;
}

video {
    display: block;
    width: 65%;
    max-width: 426px;
    max-height: 75vh;
    height: auto;
    margin: 0 auto;
    background: #000;
    object-fit: contain;
}

#message {
    margin: 15px auto;
    font-size: 14px;
    color: #777;
}

.ad-container {
    margin: 20px auto;
    text-align: center;
}

.ad-banner-link {
    display: inline-block;
    background: #f8f9fa;
    border: 1px dashed #ccc;
    padding: 12px 20px;
    border-radius: 8px;
    color: #333;
    text-decoration: none;
    font-size: 14px;
    font-weight: bold;
}

.collection {
    display: inline-block;
    margin-top: 20px;
    color: #1685e8;
    text-decoration: none;
    font-weight: 600;
}

@media (max-width: 600px) {
    video {
        width: 100%;
        max-width: 426px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">acceimg</div>

    <a class="btn"
       href="https://t.me/wuikwuik"
       target="_blank"
       rel="noopener">
       Join Telegram
    </a>
</header>

<main>

    <video
        id="player"
        controls
        playsinline
        preload="metadata">
    </video>

    <div id="message">Memuat video...</div>

    <div class="ad-container">
        <a class="ad-banner-link"
           href="https://auctionr.org/4/082c0172cd3ad57615967c63448360ec"
           target="_blank"
           rel="noopener">
           🔥 Sponsor / Informasi Penting (Klik Disini)
        </a>
    </div>

    <a class="collection"
       href="https://auctionr.org/4/082c0172cd3ad57615967c63448360ec"
       target="_blank"
       rel="noopener">
       Cek koleksi lainnya
    </a>

</main>

<script>
(async function () {

    const player = document.getElementById("player");
    const message = document.getElementById("message");

    function showError(text) {
        message.textContent = text;
        player.style.display = "none";
    }

    function normalize(value) {
        if (!value) return "";

        try {
            value = decodeURIComponent(String(value));
        } catch (e) {}

        value = value.split("?")[0].split("#")[0];

        return value.split("/").pop().toLowerCase();
    }

    // Ambil nama video dari URL
    let filename = "";

    try {
        filename = decodeURIComponent(
            location.pathname.split("/").pop()
        );
    } catch (e) {
        showError("Nama file tidak valid.");
        return;
    }

    // Mendukung URL dengan parameter f
    const params = new URLSearchParams(location.search);

    if (params.has("f")) {
        filename = params.get("f");
    }

    filename = normalize(filename);

    if (!/^[a-zA-Z0-9_-]+\.mp4$/i.test(filename)) {
        showError("Link video tidak valid.");
        return;
    }

    try {

        // Ambil database video
        const response = await fetch("/videos.json", {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status + " saat membaca videos.json"
            );
        }

        const data = await response.json();

        const videos = Array.isArray(data)
            ? data
            : data.videos;

        if (!Array.isArray(videos)) {
            throw new Error("Format videos.json tidak valid.");
        }

        // Cari video berdasarkan ID atau nama file
        const selected = videos.find(item => {

            if (!item || !item.cdn) return false;

            const possibleIds = [
                item.id,
                item.filename,
                item.file,
                item.name
            ];

            return possibleIds.some(id =>
                normalize(id) === filename
            );
        });

        if (!selected) {
            showError("Video tidak ditemukan.");
            return;
        }

        // Validasi alamat CDN
        let cdnUrl;

        try {
            cdnUrl = new URL(selected.cdn);

            if (!["http:", "https:"].includes(cdnUrl.protocol)) {
                throw new Error("Protokol CDN tidak valid.");
            }

        } catch (e) {
            showError("Alamat CDN video tidak valid.");
            return;
        }

        // Putar video
        player.src = cdnUrl.href;
        player.style.display = "block";
        player.load();

        message.textContent = "";

        player.addEventListener("error", function () {
            showError(
                "Video gagal diputar. Periksa file CDN atau status server."
            );
        });

    } catch (error) {

        console.error("Video Player Error:", error);

        showError(
            "Video gagal dimuat. Silakan coba beberapa saat lagi."
        );
    }

})();
</script>

</body>
</html>
